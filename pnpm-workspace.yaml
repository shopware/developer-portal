packages: []

shamefullyHoist: true
nodeLinker: hoisted

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: false
  esbuild: true
  playwright-chromium: true
  vue-demi: true

catalog:
  vitepress-shopware-docs: ^1.3.7

# These published packages reference vitepress-shopware-docs via a local link.
overrides:
  '@shopware-docs/storybook>vitepress-shopware-docs': 'catalog:'
  '@shopware-docs/vitepress>vitepress-shopware-docs': 'catalog:'
  '@shopware-docs/vitest>vitepress-shopware-docs': 'catalog:'

peerDependencyRules:
  ignoreMissing:
    - '@algolia/client-search'
    - react
    - react-dom
    - '@types/react'
    - '@stoplight/mosaic-code-viewer'
    - mkdirp
    - vite

patchedDependencies:
  vitepress-shopware-docs: patches/vitepress-shopware-docs.patch
  vitepress: patches/vitepress.patch
minimumReleaseAgeExclude:
  - '@types/node@26.6.10'
