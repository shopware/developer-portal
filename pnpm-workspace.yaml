peerDependencyRules:
  ignoreMissing:
    - "@algolia/client-search"
    - react
    - react-dom
    - "@types/react"
    - "@stoplight/mosaic-code-viewer"
    - mkdirp
    - vite

patchedDependencies:
  vitepress-shopware-docs: patches/vitepress-shopware-docs.patch
  vitepress: patches/vitepress.patch

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  core-js: true
  esbuild: true
  playwright-chromium: true
  vue-demi: true

overrides:
  "@remix-run/router": ^1.23.2
  "@sentry/browser": ^7.119.1
  esbuild: ^0.28.1
  js-yaml: ^4.2.0
  lodash: ^4.18.1
  minimatch: ^9.0.7
  path-to-regexp: ^3.3.0
  playwright: ^1.55.1
  qs: ^6.15.2
  react-router: ^6.30.4
  tar: ^7.5.16
  uuid: ^11.1.1
  vite: ^6.4.3
  webpack: ^5.104.1
  vitest: ^3.2.6
